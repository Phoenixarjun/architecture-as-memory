name: AAM Cross-Ecosystem Release Pipeline

on:
  push:
    tags:
      - 'v*'

jobs:
  # 1. Build and Publish Rust Crate to Crates.io
  publish-rust:
    name: 🦀 Publish Rust Crate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        run: npm ci

      - name: Compile CLI Visualizer Assets
        run: npm run build:cli

      - name: Run Cross-Ecosystem Asset Bundler
        run: npm run bundle:all

      - name: Publish to Crates.io
        working-directory: packages/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish

  # 2. Build and Publish Python Package to PyPI
  publish-python:
    name: 🐍 Publish Python Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile CLI Visualizer Assets
        run: npm run build:cli

      - name: Run Cross-Ecosystem Asset Bundler
        run: npm run bundle:all

      - name: Install Hatch build tool
        run: pip install hatch

      - name: Build Python Distribution Files
        working-directory: packages/python
        run: hatch build

      - name: Publish Package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: packages/python/dist/
